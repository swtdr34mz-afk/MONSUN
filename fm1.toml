# MONSUN build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "monsun"                   # the build's file names: monsun-0.1.fwsc, build/host/monsun_host
title = "MONSUN"                  # the name people see (firmware hubs)
id_prefix = "FM-1_591"            # package identity: dev FM-1_59100, releases FM-1_591 + XXYYZZ (RAND 588)
usb_manufacturer = "swtdr34mz"
usb_product = "MONSUN FM-1"       # the USB name (the MIDI port in a DAW)
o2 = ["dsp/monsun_core.c"]        # the sound core, at -O2 (the same files a VST would use)
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
tagline = "A mono synth after the Dreadbox Typhon: one WAVE knob, three modulators, three FX blocks, a storm"
repo = "https://github.com/swtdr34mz-afk/MONSUN"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A monophonic synth in the manner of the Dreadbox Typhon: two oscillators whose wave combinations one WAVE knob fades through (up to FM), a self-oscillating 24 dB ladder low-pass, filter and amp ADSRs with FILTER TIME and AMP TIME, three modulators (LFO, envelope, random, step sequencer) with several destinations each, FX1 distortions and bit crusher, FX2 chorus / ensemble / flanger, FX3 delay, ping pong and two reverbs, a 32-step note sequencer with record, tie, probability and swing, and STORM: detuned copies and stereo width on one knob. 16 presets, MIDI clock in. Unofficial."
tags = ["synth"]
install = "https://github.com/swtdr34mz-afk/MONSUN/releases"
screenshot = "site/img/screen-main.png"
